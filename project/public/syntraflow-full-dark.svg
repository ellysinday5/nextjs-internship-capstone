<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGradMidDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4e8"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="flowGradDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00d4e8"/>
    </linearGradient>
  </defs>

  <!-- Icon mark - white bars instead of navy so it's visible on a navy background -->
  <g>
    <rect x="20" y="52" width="16" height="46" rx="7" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="52" y="30" width="16" height="68" rx="7" fill="url(#barGradMidDark)"/>
    <rect x="84" y="64" width="16" height="34" rx="7" fill="#ffffff" fill-opacity="0.55"/>

    <path
      d="M14 44 C 34 18, 46 18, 60 26 C 74 34, 86 34, 106 16"
      fill="none"
      stroke="url(#flowGradDark)"
      stroke-width="6"
      stroke-linecap="round"
    />
    <circle cx="106" cy="16" r="6" fill="#00d4e8"/>
  </g>

  <!-- Wordmark - white "Syntra" instead of navy so it's visible on a navy background -->
  <text
    x="128"
    y="76"
    font-family="Arial, Helvetica, sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="-0.5"
  >
    <tspan fill="#ffffff">Syntra</tspan><tspan fill="#00d4e8">Flow</tspan>
  </text>
</svg>
