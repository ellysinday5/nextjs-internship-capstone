<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGradMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4e8"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#142843"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>

  <!-- Kanban columns (varying "progress" heights) -->
  <rect x="20" y="52" width="16" height="46" rx="7" fill="#142843"/>
  <rect x="52" y="30" width="16" height="68" rx="7" fill="url(#barGradMid)"/>
  <rect x="84" y="64" width="16" height="34" rx="7" fill="#1c3457"/>

  <!-- Flow line arcing over the columns, tying them together -->
  <path
    d="M14 44 C 34 18, 46 18, 60 26 C 74 34, 86 34, 106 16"
    fill="none"
    stroke="url(#flowGrad)"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Small node dot at the tip of the flow line, like a cursor/progress marker -->
  <circle cx="106" cy="16" r="6" fill="#00b4d8"/>
</svg>
